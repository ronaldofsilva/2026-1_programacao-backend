version: '3.8'
services:
  upload-service:            # Node.js
    build: ./node-upload
    ports: ["3000:3000"]
    volumes:
      - uploads_data:/app/uploads
    networks: [backend]
  mongodb:                   # MongoDB
    image: mongo:7
    ports: ["27017:27017"]
    volumes:
      - mongo_data:/data/db
    networks: [backend]
  spring-app:                # Spring Boot
    build: .
    ports: ["8080:8080"]
    environment:
      NODE_URL: http://upload-service:3000
      MONGO_URI: mongodb://mongodb:27017/backend_db
    depends_on: [upload-service, mongodb]
    networks: [backend]
networks:
  backend:
volumes:
  uploads_data:
  mongo_data:
